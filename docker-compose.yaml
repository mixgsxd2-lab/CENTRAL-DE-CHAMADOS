# Teste local da imagem que será publicada no ECR/EKS:
#   docker compose up --build   ->  http://localhost:8005
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-Hrg@12345}
      POSTGRES_DB: ${PGDATABASE:-Central_Chamados}
    volumes:
      - chamador-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-Central_Chamados}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chamador:
    build: .
    image: chamador-enfermagem:latest
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-Central_Chamados}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-Hrg@12345}
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-local}
      SESSION_COOKIE_SECURE: "1"   # "1" apenas atrás de HTTPS
      DADOS_DEMO: ${DADOS_DEMO:-1}
      HOTELARIA_USUARIO: ${HOTELARIA_USUARIO:-admin}
      HOTELARIA_SENHA: ${HOTELARIA_SENHA:-12345}
      ENFERMAGEM_USUARIO: ${ENFERMAGEM_USUARIO:-enfermagem}
      ENFERMAGEM_SENHA: ${ENFERMAGEM_SENHA:-12345}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  chamador-mysql:
