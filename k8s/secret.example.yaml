# Exemplo — NÃO aplique nem commite valores reais.
# Configure o endpoint e as credenciais do PostgreSQL acessível pelo cluster.
# Se o banco estiver vazio, a aplicação cria as tabelas ao iniciar.
apiVersion: v1
kind: Secret
metadata:
  name: central-chamados-secrets
  namespace: prd-central-chamados
type: Opaque
stringData:
  SECRET_KEY: "trocar"
  PGHOST: "host-do-postgresql"
  PGPORT: "5432"
  PGDATABASE: "central_chamados"
  PGUSER: "trocar"
  PGPASSWORD: "trocar"
  HOTELARIA_USUARIO: "trocar"
  HOTELARIA_SENHA: "trocar"
  ENFERMAGEM_USUARIO: "trocar"
  ENFERMAGEM_SENHA: "trocar"
