# Exemplo — NÃO commite valores reais. Crie com:
#   kubectl -n prd-central-chamados create secret generic central-chamados-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=HOTELARIA_SENHA='...' \
#     --from-literal=ENFERMAGEM_SENHA='...'
apiVersion: v1
kind: Secret
metadata:
  name: central-chamados-secrets
  namespace: prd-central-chamados
type: Opaque
stringData:
  SECRET_KEY: "trocar"
  HOTELARIA_USUARIO: "trocar"
  HOTELARIA_SENHA: "trocar"
  ENFERMAGEM_USUARIO: "trocar"
  ENFERMAGEM_SENHA: "trocar"
