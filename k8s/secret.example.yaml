# Exemplo do Secret de configuração da aplicação — NÃO aplique nem commite
# valores reais. As credenciais de conexão ao PostgreSQL ficam separadas no
# Secret central-chamados-db, criado/gerenciado pela equipe responsável pelo RDS.
# Se o banco estiver vazio, a aplicação cria as tabelas ao iniciar.
apiVersion: v1
kind: Secret
metadata:
  name: central-chamados-secrets
  namespace: prd-central-chamados
type: Opaque
stringData:
  SECRET_KEY: "trocar"
  HOTELARIA_USUARIO: "trocar"
  HOTELARIA_SENHA: "trocar"
  ENFERMAGEM_USUARIO: "trocar"
  ENFERMAGEM_SENHA: "trocar"
