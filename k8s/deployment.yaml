# SQLite + limitador em memória exigem exatamente uma réplica e estratégia
# Recreate: o volume EBS ReadWriteOnce não pode ser montado por dois Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-chamados
  namespace: prd-central-chamados
  labels:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: central-chamados
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: central-chamados
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-chamados
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: central-chamados
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          # Tag imutável publicada no ECR compartilhado da Central de Serviços.
          image: 911107441482.dkr.ecr.sa-east-1.amazonaws.com/centralservicos-frontend:central-chamados-2026-10-14-1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - {name: PORT, value: "8000"}
            - {name: DATABASE_PATH, value: /data/hospital_rio_grande.db}
            - {name: FLASK_DEBUG, value: "0"}
            - {name: SESSION_COOKIE_SECURE, value: "1"}
            - {name: DADOS_DEMO, value: "0"}
          envFrom:
            - secretRef:
                name: central-chamados-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: central-chamados-data
---
apiVersion: v1
kind: Service
metadata:
  name: central-chamados
  namespace: prd-central-chamados
  labels:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: central-chamados
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 80
      targetPort: http
