# O limitador de login (em memória) exige uma réplica e estratégia Recreate.
# O PostgreSQL deve estar provisionado separadamente e acessível pela rede;
# os dados do banco não ficam no container da aplicação.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-chamados
  namespace: prd-central-chamados
  labels:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: central-chamados
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: central-chamados
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-chamados
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: central-chamados
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          # Tag imutável publicada no ECR compartilhado da Central de Serviços.
          image: 911107441482.dkr.ecr.sa-east-1.amazonaws.com/centralservicos-frontend:central-chamados-2026-11-10-1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - {name: PORT, value: "8000"}
            - {name: FLASK_DEBUG, value: "0"}
            - {name: SESSION_COOKIE_SECURE, value: "1"}
            - {name: DADOS_DEMO, value: "0"}
            # As variáveis PG* são lidas pelo psycopg2/libpq. Referencie as
            # chaves individualmente; DATABASE_URL existe no Secret do gestor,
            # mas não é usada pela aplicação e não precisa ir para o container.
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: central-chamados-db
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: central-chamados-db
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: central-chamados-db
                  key: PGDATABASE
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: central-chamados-db
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-chamados-db
                  key: PGPASSWORD
            - name: PGSSLMODE
              valueFrom:
                secretKeyRef:
                  name: central-chamados-db
                  key: PGSSLMODE
          envFrom:
            - secretRef:
                name: central-chamados-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: central-chamados
  namespace: prd-central-chamados
  labels:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: central-chamados
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 80
      targetPort: http
