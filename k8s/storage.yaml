# A StorageClass gp3 padrão já existe no cluster. Não a recrie por aplicação.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: central-chamados-data
  namespace: prd-central-chamados
  labels:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/part-of: central-chamados
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
