# O cluster usa Ingress NGINX e o cert-manager emite o certificado TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: central-chamados
  namespace: prd-central-chamados
  labels:
    app.kubernetes.io/name: central-chamados
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: central-chamados
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"
spec:
  ingressClassName: nginx
  rules:
    - host: chamados.hospitalriogrande.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: central-chamados
                port:
                  number: 80
  tls:
    - hosts:
        - chamados.hospitalriogrande.com.br
      secretName: central-chamados-hrg-prod-eks-tls
