# Exemplo apenas para documentar as chaves esperadas — NÃO aplique nem commite
# valores reais. O Secret real central-chamados-db é criado/gerenciado pela
# equipe responsável pelo RDS e deve existir no namespace prd-central-chamados.
# O código da aplicação usa PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD via
# psycopg2; DATABASE_URL não é consumida atualmente pelo código.
apiVersion: v1
kind: Secret
metadata:
  name: central-chamados-db
  namespace: prd-central-chamados
type: Opaque
stringData:
  PGHOST: "hrg-prod-postgres.cxgoc864q2tq.sa-east-1.rds.amazonaws.com"
  PGPORT: "5433"
  PGDATABASE: "central_chamados"
  PGUSER: "central_chamados_app"
  PGPASSWORD: "NÃO_PREENCHER_NEM_COMMITAR"
  PGSSLMODE: "require"
  DATABASE_URL: "postgresql://central_chamados_app:<senha>@<host>:5433/central_chamados?sslmode=require"
