# Blueprint de deploy no Render — https://render.com/docs/blueprint-spec
#
# Como usar:
#   1. Suba este repositório para o GitHub.
#   2. No Render, clique em "New" -> "Blueprint" e aponte para o repositório.
#      O Render lê este arquivo e cria o serviço sozinho.
services:
  - type: web
    name: hospital-rio-grande
    runtime: python
    rootDir: hospital_rio_grande
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PGHOST
        sync: false   # preencha no painel com o host do seu PostgreSQL gerenciado
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        value: Central_Chamados
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: HOTELARIA_USUARIO
        value: admin
      - key: HOTELARIA_SENHA
        generateValue: true
      - key: ENFERMAGEM_USUARIO
        value: enfermagem
      - key: ENFERMAGEM_SENHA
        generateValue: true
